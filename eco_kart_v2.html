<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECO KART 2 – แข่งรถรักษ์โลก</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at 30% 20%,#fff6c9,#ffd1dc 40%,#b5e3ff 100%);font-family:'Mitr',Tahoma,sans-serif;user-select:none;overflow:hidden}
.console{display:flex;align-items:stretch;filter:drop-shadow(0 18px 30px #0004)}
.joy{width:120px;border-radius:60px 0 0 60px;background:linear-gradient(160deg,#36c5f0,#0aa0d8);padding:26px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;box-shadow:inset -6px 0 0 #0003}
.joy.r{border-radius:0 60px 60px 0;background:linear-gradient(200deg,#ff6b6b,#e6304a);box-shadow:inset 6px 0 0 #0003}
.screenWrap{background:#2b2b33;padding:14px;border-top:6px solid #3a3a45;border-bottom:6px solid #1c1c22;display:flex;align-items:center}
canvas{display:block;border-radius:8px;width:min(960px,74vw);aspect-ratio:16/10;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px);gap:2px}
.pad b{background:#222;border-radius:6px;box-shadow:0 4px 0 #000;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;cursor:pointer}
.pad i{display:block}
.btn{width:58px;height:58px;border-radius:50%;background:#222;color:#fff;font:12px 'Press Start 2P';display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #000;cursor:pointer}
.btn.small{width:38px;height:38px;font-size:9px}
.pad b:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.lbl{font-size:11px;color:#fff;text-align:center;text-shadow:0 1px 0 #0005;line-height:1.35}
.ab{display:grid;grid-template-columns:58px 58px;gap:6px}
.ab .btn:first-child{margin-top:34px}
@media(max-width:760px){.joy{width:86px;padding:16px 4px}.pad{grid-template-columns:repeat(3,24px);grid-template-rows:repeat(3,24px)}.btn{width:40px;height:40px}.ab{grid-template-columns:40px 40px}}
</style></head><body>
<div class="console">
 <div class="joy">
  <div class="btn small" id="mute">♪</div>
  <div class="pad"><i></i><b id="U">▲</b><i></i><b id="L">◀</b><i></i><b id="R">▶</b><i></i><b id="D">▼</b><i></i></div>
  <div class="lbl">◀ ▶ เลี้ยว/เลือก<br>▼ เบรก</div>
 </div>
 <div class="screenWrap"><canvas id="c"></canvas></div>
 <div class="joy r">
  <div class="btn small" id="S">+</div>
  <div class="ab"><div class="btn" id="B">B</div><div class="btn" id="A">A</div></div>
  <div class="lbl">A / SPACE<br>ยืนยัน / ไอเทม<br>+ เปลี่ยนตัวละคร</div>
 </div>
</div>
<script>
// ================= SETUP (high-res canvas) =================
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=640,H=400;
const RS=Math.min(3,Math.max(2,(window.devicePixelRatio||1)*1.5));
cv.width=W*RS;cv.height=H*RS;x.imageSmoothingQuality='high';
const PX="'Press Start 2P',monospace",TH="'Mitr',Tahoma,sans-serif";
const SEG=200,RUMBLE=3,ROADW=2000,LANES=3,FOV=100,CAMH=1000,DRAW=300;
const CAMD=1/Math.tan(FOV/2*Math.PI/180),PLAYERZ=CAMH*CAMD;
const MAXS=SEG*60,ACCEL=MAXS/5,BRAKE=-MAXS,DECEL=-MAXS/5,OFFDEC=-MAXS/2,OFFLIM=MAXS/4,CENTRI=0.3,LAPS=3;
const COL={light:{road:'#8d8d95',grass:'#72d66b',rumble:'#ff4d5e',lane:'#fff'},
 dark:{road:'#85858d',grass:'#5fc65a',rumble:'#fff',lane:null},
 s1:{road:'#fff',grass:'#72d66b',rumble:'#ff4d5e',lane:null},s2:{road:'#222',grass:'#5fc65a',rumble:'#fff',lane:null}};

// ================= CHARACTERS & KARTS =================
const CHARS=[
 {id:'princess',n:'เจ้าหญิงลีฟ',e:'PRINCESS',sp:2,ac:4,hd:4,wt:1,d:'ออกตัวไว เลี้ยวคล่อง'},
 {id:'dog',n:'น้องหมาโฮป',e:'DOGGO',sp:4,ac:3,hd:3,wt:3,d:'วิ่งเร็ว สมดุลดี'},
 {id:'turtle',n:'เต่าเทอร์โบ',e:'TURTLE',sp:3,ac:2,hd:3,wt:5,d:'ตัวหนัก ชนแล้วไม่ค่อยช้า'}];
const KARTS=[
 {id:'leaf',n:'Leaf Racer',c:'#3cc85a',sp:3,ac:3,hd:3,d:'สมดุลทุกด้าน'},
 {id:'solar',n:'Solar Speeder',c:'#2f8cff',sp:5,ac:2,hd:2,d:'ความเร็วสูงสุด'},
 {id:'ev',n:'EV Buggy',c:'#ffd23f',sp:3,ac:5,hd:2,d:'ออกตัวไว ล้อใหญ่'},
 {id:'bamboo',n:'Bamboo Cart',c:'#d9a066',sp:2,ac:3,hd:5,d:'เลี้ยวคล่องมาก'}];
let charI=0,kartI=0,selI=0,P={sp:1,ac:1,hd:1,wt:3};
function calcStats(){const c=CHARS[charI],k=KARTS[kartI];
 P={sp:.9+(c.sp+k.sp)*.025,ac:.7+(c.ac+k.ac)*.08,hd:.7+(c.hd+k.hd)*.07,wt:c.wt}}

// ================= TRACK =================
let segs=[],L=0;
const lastY=()=>segs.length?segs[segs.length-1].p2.world.y:0;
const easeIn=(a,b,p)=>a+(b-a)*p*p, easeIO=(a,b,p)=>a+(b-a)*(-Math.cos(p*Math.PI)/2+.5), lerp=(a,b,p)=>a+(b-a)*p;
function addSeg(curve,y){const n=segs.length;segs.push({index:n,curve,sprites:[],cars:[],
 p1:{world:{y:lastY(),z:n*SEG},camera:{},screen:{}},p2:{world:{y,z:(n+1)*SEG},camera:{},screen:{}},
 color:Math.floor(n/RUMBLE)%2?COL.dark:COL.light})}
function road(e,h,l,curve,hill){const sy=lastY(),ey=sy+hill*SEG,t=e+h+l;
 for(let n=0;n<e;n++)addSeg(easeIn(0,curve,n/e),easeIO(sy,ey,n/t));
 for(let n=0;n<h;n++)addSeg(curve,easeIO(sy,ey,(e+n)/t));
 for(let n=0;n<l;n++)addSeg(easeIO(curve,0,n/l),easeIO(sy,ey,(e+h+n)/t))}
function buildTrack(){
 segs=[];
 road(30,30,30,0,0);road(40,60,40,3,0);road(50,50,50,0,30);road(40,40,40,-5,0);road(30,40,30,4,-20);
 road(30,30,30,-4,0);road(30,30,30,5,20);road(50,80,50,-3,-30);road(40,40,40,0,0);road(40,60,40,6,0);
 road(50,50,50,0,40);road(30,30,30,-6,0);road(30,30,30,6,0);road(60,60,60,-2,0);
 road(40,60,40,0,-lastY()/SEG);
 L=segs.length*SEG;
 for(let i=0;i<RUMBLE;i++){segs[6+i].color=COL.s1;segs[6+RUMBLE+i].color=COL.s2}
 for(let n=12;n<segs.length;n+=4){
  const side=Math.random()<.5?-1:1,r=Math.random();
  segs[n].sprites.push({type:r<.55?'tree':r<.75?'bush':r<.88?'flower':'turbine',offset:side*(1.4+Math.random()*2.2)});
  if(n%40===0)segs[n].sprites.push({type:'sign',offset:-side*1.35,txt:['♻ RECYCLE','🌱 GO GREEN','⚡ EV ZONE','🌍 SAVE EARTH'][Math.floor(n/40)%4]});
 }
 for(let n=120;n<segs.length-60;n+=230)[-.55,0,.55].forEach(o=>segs[n].sprites.push({type:'box',offset:o,t:0}));
 for(let n=60;n<segs.length-30;n+=160){const o=(Math.random()-.5)*1.2;for(let k=0;k<6;k++)segs[n+k*3].sprites.push({type:'coin',offset:o,t:0})}
}
const findSeg=z=>segs[Math.floor(z/SEG)%segs.length];

// ================= SOUND =================
let AC=null,muted=false,eng=null;
function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC}
function tone(f,d=.1,type='square',v=.07,delay=0){if(muted)return;const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;
 o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(1e-4,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d)}
const sfx={beep:()=>tone(440,.25),go:()=>tone(880,.5),coin:()=>{tone(988,.06);tone(1319,.15,'square',.07,.06)},
 box:()=>[600,700,800,900,1000].forEach((f,i)=>tone(f,.05,'square',.05,i*.05)),boost:()=>[300,450,600,900].forEach((f,i)=>tone(f,.1,'sawtooth',.06,i*.04)),
 bump:()=>tone(120,.2,'sawtooth',.1),lap:()=>[659,784,1047].forEach((f,i)=>tone(f,.12,'square',.07,i*.1)),
 win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.15,'square',.07,i*.12)),star:()=>[1047,1175,1319,1568].forEach((f,i)=>tone(f,.08,'square',.05,i*.05)),
 move:()=>tone(700,.05,'square',.05),ok:()=>{tone(880,.08);tone(1175,.12,'square',.07,.07)},pass:()=>{tone(784,.06);tone(1047,.06,'square',.06,.05);tone(1568,.12,'square',.06,.1)}};
function engine(on){if(muted||!on){if(eng)eng.g.gain.value=0;return}
 if(!eng){const a=ac(),o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain();o.type='sawtooth';f.type='lowpass';f.frequency.value=500;g.gain.value=0;o.connect(f).connect(g).connect(a.destination);o.start();eng={o,g}}
 eng.g.gain.value=.025;eng.o.frequency.value=55+speed/MAXS*140+(boostT>0?40:0)}

// ================= STATE =================
const RIVALS=[{n:'TURBO',c:'#2f8cff'},{n:'SOLAR',c:'#ffd23f'},{n:'PINKY',c:'#ff8fab'},{n:'VOLT',c:'#9b5cff'},{n:'OCEAN',c:'#20c9b5'}];
let st='title',pos=0,px=0,speed=0,lap=0,time=0,best=+localStorage.kartBest||0,hi=+localStorage.kartHi||0,coins=0,item=null,roulette=0,boostT=0,starT=0,cars=[];
let count=0,lastC=4,steer=0,skyO=0,hillO=0,treeO=0,t=0,msg='',msgT=0,finalRank=0,shake=0,parts=[],keys={};
let score=0,shownS=0,prevRank=6,pops=[],finBonus=0;
function reset(){buildTrack();calcStats();pos=0;px=0;speed=0;lap=0;time=0;coins=0;item=null;roulette=0;boostT=0;starT=0;parts=[];
 score=0;shownS=0;prevRank=6;pops=[];
 const others=CHARS.filter((_,i)=>i!==charI).map(c=>c.id);
 cars=RIVALS.map((r,i)=>({...r,drv:others[i%others.length],style:KARTS[(i+1)%KARTS.length].id,z:PLAYERZ+SEG*(4+i*3),offset:i%2?.5:-.5,lap:0,speed:0,max:MAXS*(.88+i*.025),tgt:i%2?.5:-.5}));
 st='count';count=3.99;lastC=4}
function addS(n,label,c='#ffe066'){score=Math.max(0,score+n);pops.push({txt:(n>0?'+':'')+n+' '+label,c:n<0?'#ff6b6b':c,t:1.3,y:175+pops.length*22})}

// ================= INPUT =================
const isSel=()=>st==='selChar'||st==='selKart';
function nav(d){if(!isSel())return;const n=st==='selChar'?CHARS.length:KARTS.length;selI=(selI+d+n)%n;sfx.move()}
addEventListener('keydown',e=>{if(!keys[e.key]&&isSel()){if(e.key==='ArrowLeft'||e.key==='a')nav(-1);if(e.key==='ArrowRight'||e.key==='d')nav(1);if(e.key==='Escape'||e.key==='Backspace')back()}
 keys[e.key]=true;if(e.code==='Space'||e.key==='Enter'){e.preventDefault();act()}if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key]=false);
const hold=(el,k,d)=>{el.onpointerdown=e=>{e.preventDefault();keys[k]=true;if(d)nav(d)};el.onpointerup=el.onpointerleave=()=>keys[k]=false};
hold(L,'ArrowLeft',-1);hold(R,'ArrowRight',1);hold(D,'ArrowDown');hold(U,'ArrowUp');
B.onpointerdown=e=>{e.preventDefault();if(isSel())back();else keys.ArrowDown=true};B.onpointerup=B.onpointerleave=()=>keys.ArrowDown=false;
A.onclick=act;S.onclick=()=>{ac();engine(false);st='selChar';selI=charI};
mute.onclick=()=>{muted=!muted;mute.textContent=muted?'×':'♪';engine(false)};
cv.onpointerdown=e=>{const r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)*W/r.width,my=(e.clientY-r.top)*H/r.height;
 if(isSel()){const cards=cardRects();const i=cards.findIndex(c=>mx>c.x&&mx<c.x+c.w&&my>c.y&&my<c.y+c.h);
  if(i>=0){if(i===selI)act();else{selI=i;sfx.move()}}return}
 if(st==='title'||st==='finish')act()};
function back(){if(st==='selKart'){st='selChar';selI=charI;sfx.move()}else if(st==='selChar'){st='title'}}
function act(){ac();
 if(st==='title'){st='selChar';selI=charI;sfx.ok();return}
 if(st==='selChar'){charI=selI;st='selKart';selI=kartI;sfx.ok();return}
 if(st==='selKart'){kartI=selI;sfx.ok();reset();return}
 if(st==='finish'){reset();return}
 if(st==='race')useItem()}
function say(s){msg=s;msgT=1.6}
function useItem(){if(!item||roulette>0)return;
 if(item==='boost'){boostT=1.8;sfx.boost();say('TURBO LEAF!')}
 if(item==='star'){starT=5;boostT=5;sfx.star();say('SOLAR STAR! ชนใครก็กระเด็น')}
 if(item==='coin'){coins=Math.min(10,coins+3);sfx.coin();addS(30,'COINS');say('+3 COINS')}
 item=null}

// ================= UPDATE =================
function update(dt){
 t+=dt;msgT-=dt;shake*=.85;
 if(shownS<score)shownS+=Math.ceil((score-shownS)/8);else shownS=score;
 for(const p of pops){p.t-=dt;p.y-=dt*25}pops=pops.filter(p=>p.t>0);
 if(st==='count'){count-=dt;const c=Math.ceil(count);if(c<lastC){lastC=c;c>0?sfx.beep():(sfx.go(),st='race')}}
 if(st!=='race'&&st!=='count'){engine(false);if(cars.length)updateCars(dt,false);return}
 const ps=findSeg(pos+PLAYERZ),sp=speed/MAXS,dx=dt*2*sp,start=pos;
 let np=pos+dt*speed;
 if(np>=L){np-=L;lap++;if(lap>=LAPS){pos=np;finish();return}else{sfx.lap();addS(200,'LAP BONUS','#7bdff2');say(lap===LAPS-1?'FINAL LAP!':'LAP '+(lap+1)+'/'+LAPS)}}
 pos=np;
 const left=keys.ArrowLeft||keys.a||keys.A,right=keys.ArrowRight||keys.d||keys.D,brake=keys.ArrowDown||keys.s||keys.S;
 steer=lerp(steer,left?-1:right?1:0,.2);
 if(st==='race'){px+=steer*dx*1.1*P.hd;px-=dx*sp*ps.curve*CENTRI*(2-P.hd);
  const top=MAXS*P.sp*(1+coins*.012)*(boostT>0?1.4:1);
  if(brake)speed+=BRAKE*dt;else if(speed<top)speed+=ACCEL*P.ac*dt*(boostT>0?3:1);else speed=Math.max(top,speed+DECEL*dt*2);
  if(Math.abs(px)>1&&starT<=0){if(speed>OFFLIM)speed+=OFFDEC*dt;if(Math.random()<.3)parts.push({x:W/2+(Math.random()-.5)*120,y:H-20,vx:(Math.random()-.5)*3,vy:-2-Math.random()*2,c:'#8b5a2b',t:.6,r:4})}
 }
 boostT-=dt;starT-=dt;if(roulette>0){roulette-=dt;if(roulette<=0)say(item==='boost'?'ได้ TURBO LEAF 🍃':item==='star'?'ได้ SOLAR STAR ⭐':'ได้ COINS 🪙')}
 for(const s of ps.sprites){if(s.t>0)continue;const d=Math.abs(px-s.offset);
  if(s.type==='coin'&&d<.25){s.t=8;coins=Math.min(10,coins+1);sfx.coin();addS(10,'🪙');burst(W/2,H-110,['#ffe066','#fff'],8)}
  else if(s.type==='box'&&d<.3){s.t=6;sfx.box();addS(20,'ITEM');burst(W/2,H-110,['#ff4d5e','#ffd23f','#3cc85a','#2f8cff','#fff'],16);
   if(!item){const r=Math.random(),rank=getRank();item=r<(rank>3?.3:.08)?'star':r<.7?'boost':'coin';roulette=1}}
  else if(['tree','turbine','sign'].includes(s.type)&&d<.35&&starT<=0){speed=Math.max(MAXS/6,speed*(.1+P.wt*.08));shake=10;sfx.bump();addS(-20,'CRASH');px+=px>s.offset?.1:-.1;s.t=1}}
 segs.forEach(sg=>sg.sprites.forEach(s=>{if(s.t>0)s.t-=dt}));
 for(const c of cars){let gap=c.z-(pos+PLAYERZ);if(gap<-L/2)gap+=L;if(gap>L/2)gap-=L;
  if(gap>-SEG*.4&&gap<SEG*.6&&Math.abs(px-c.offset)<.38){
   if(starT>0){if(!c.hit||t-c.hit>1){c.hit=t;addS(150,'STAR HIT!','#ff8fab')}c.speed*=.3;c.offset+=px>c.offset?-.8:.8;burst(W/2,H-120,['#ffe066','#fff','#ff8fab'],14)}
   else if(speed>c.speed){speed=c.speed*(.6+P.wt*.05);shake=8;sfx.bump();px+=px>c.offset?.15:-.15}}}
 px=Math.max(-2.6,Math.min(2.6,px));speed=Math.max(0,Math.min(speed,MAXS*1.9));
 const curv=ps.curve*(pos-start)/SEG;skyO=(skyO+.0004*curv+1)%1;hillO=(hillO+.0012*curv+1)%1;treeO=(treeO+.0024*curv+1)%1;
 updateCars(dt,st==='race');
 if(st==='race'){time+=dt;const r=getRank();if(r<prevRank){addS(100*(prevRank-r),'OVERTAKE!','#7bdff2');sfx.pass()}prevRank=r}
 engine(st==='race');
 if(boostT>0&&Math.random()<.8)for(const s of[-1,1])parts.push({x:W/2+s*38,y:H-22,vx:s*Math.random(),vy:1+Math.random()*2,c:starT>0?`hsl(${t*600%360},100%,60%)`:['#ffd23f','#ff8a3d','#fff'][Math.random()*3|0],t:.35,r:5});
}
function updateCars(dt,go){
 segs.forEach(s=>s.cars.length=0);
 const pp=lap*L+pos+PLAYERZ;
 for(const c of cars){
  if(go){const cp=c.lap*L+c.z,gap=cp-pp;let target=c.max*(gap<-SEG*40?1.18:gap>SEG*60?.88:1);
   c.speed+=(target-c.speed)*dt*.6;
   if(Math.random()<.01)c.tgt=(Math.random()-.5)*1.5;
   const ahead=findSeg(c.z+SEG*8);c.tgt-=ahead.curve*.002;
   c.offset+=(c.tgt-c.offset)*dt*1.2;c.offset=Math.max(-.85,Math.min(.85,c.offset));
   let nz=c.z+c.speed*dt;if(nz>=L){nz-=L;c.lap++}c.z=nz}
  findSeg(c.z).cars.push(c)}
}
function getRank(){const pp=lap*L+pos+PLAYERZ;return 1+cars.filter(c=>c.lap*L+c.z>pp).length}
function finish(){finalRank=getRank();st='finish';lap=LAPS;engine(false);
 finBonus=[1000,700,500,300,200,100][finalRank-1]+coins*20;addS(finBonus,'FINISH');shownS=score;
 if(finalRank===1&&(!best||time<best)){best=time;localStorage.kartBest=best}
 if(score>hi){hi=score;localStorage.kartHi=hi}sfx.win()}
function burst(X,Y,cols,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=2+Math.random()*4;parts.push({x:X,y:Y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,c:cols[i%cols.length],t:.8,r:3+Math.random()*3,star:true})}}

// ================= DRAW HELPERS =================
function project(p,cx,cy,cz){p.camera.x=-cx;p.camera.y=p.world.y-cy;p.camera.z=p.world.z-cz;
 p.screen.scale=CAMD/p.camera.z;p.screen.x=W/2+p.screen.scale*p.camera.x*W/2;
 p.screen.y=H/2-p.screen.scale*p.camera.y*H/2;p.screen.w=p.screen.scale*ROADW*W/2}
function poly(a,b,c,d,e,f,g,h,col){x.fillStyle=col;x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.lineTo(e,f);x.lineTo(g,h);x.closePath();x.fill()}
function drawSeg(x1,y1,w1,x2,y2,w2,fog,c){
 x.fillStyle=c.grass;x.fillRect(0,y2,W,y1-y2+1);
 const r1=w1/5,r2=w2/5;
 poly(x1-w1-r1,y1+.5,x1-w1,y1+.5,x2-w2,y2,x2-w2-r2,y2,c.rumble);poly(x1+w1+r1,y1+.5,x1+w1,y1+.5,x2+w2,y2,x2+w2+r2,y2,c.rumble);
 poly(x1-w1,y1+.5,x1+w1,y1+.5,x2+w2,y2,x2-w2,y2,c.road);
 if(c.lane){const l1=w1/32,l2=w2/32,lw1=w1*2/LANES,lw2=w2*2/LANES;let lx1=x1-w1+lw1,lx2=x2-w2+lw2;
